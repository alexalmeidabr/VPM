<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Manager Starter</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="blue-grey lighten-5">
    <nav class="blue-grey darken-3">
      <div class="nav-wrapper container">
        <a href="#" class="brand-logo">VPM • Projects</a>
      </div>
    </nav>

    <main class="container section">
      <div class="row">
        <div class="col s12 l5">
          <div class="card">
            <div class="card-content">
              <span class="card-title" id="form-title">Add Project</span>
              <form id="project-form">
                <input type="hidden" id="project-id" />

                <div class="input-field">
                  <input id="project-name" name="projectName" type="text" required />
                  <label for="project-name">Project Name</label>
                </div>

                <div class="input-field">
                  <input id="client-name" name="clientName" type="text" required />
                  <label for="client-name">Client Name</label>
                </div>

                <div class="input-field">
                  <input id="project-lead" name="projectLead" type="text" required />
                  <label for="project-lead">Project Lead (Our Side)</label>
                </div>

                <div class="input-field">
                  <input id="client-contact" name="clientContact" type="text" required />
                  <label for="client-contact">Client Contact</label>
                </div>

                <div class="row date-row">
                  <div class="input-field col s12 m6">
                    <input id="start-date" name="startDate" type="date" required />
                    <label class="active" for="start-date">Start Date</label>
                  </div>
                  <div class="input-field col s12 m6">
                    <input id="end-date" name="endDate" type="date" required />
                    <label class="active" for="end-date">End Date</label>
                  </div>
                </div>

                <div class="card-action action-row">
                  <button class="btn waves-effect waves-light" type="submit" id="save-btn">
                    Save Project
                    <i class="material-icons right">save</i>
                  </button>
                  <button class="btn-flat" type="button" id="cancel-edit-btn" hidden>
                    Cancel Edit
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col s12 l7">
          <div class="card">
            <div class="card-content">
              <span class="card-title">Project Register</span>
              <p class="grey-text" id="project-count"></p>
              <div class="table-container">
                <table class="striped responsive-table" id="projects-table">
                  <thead>
                    <tr>
                      <th>Project</th>
                      <th>Client</th>
                      <th>Lead</th>
                      <th>Client Contact</th>
                      <th>Dates</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="projects-body"></tbody>
                </table>
              </div>
              <p id="empty-state" class="center-align grey-text text-darken-1 empty-message">
                No projects yet. Add your first project from the form.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
